[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "purchasepilot"
version = "0.1.0"
description = "PurchasePilot: browser-assisted procurement agent (student prototype)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8,<3",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.38",
    "fastapi>=0.112",
    "jinja2>=3.1",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "stagehand>=4.4,<5",
    "openai>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["procurement", "mock_sites"]
